erial should contain silica????","a":"As thermal Displacive Transformation of silica is accompanied by volumetric expansion to compensate the solidification shrinkage of melting metals","pg":"lb9","src":"Logbook p.9 Q1"},{"s":"Dental Biomaterials","k":"sa","im":[302],"tip":null,"p":"Why the base is used under large amalgam","a":"To avoid thermal pulp shock as amalgam has high thermal conductivity","pg":"lb11","src":"Logbook p.11 Q1"},{"s":"Dental Biomaterials","k":"sa","im":[301],"tip":null,"p":"Which type of alloys can be casted by this centrifugal casting machine? Justifying your answer. Mention the name of casting defect.","a":"Low density alloys (base metals) ; back pressure porosity","pg":"lb11","src":"Logbook p.11 Q2"},{"s":"Dental Biomaterials","k":"sa","im":[300],"tip":null,"p":"Gas air torch (maximum heating temperature is 900 oc) why it is used with gold alloy only???","a":"As it adjusted to low gold melting temperature ; (gold has low specific heat)","pg":"lb11","src":"Logbook p.11 Q3"},{"s":"Dental Biomaterials","k":"sa","im":[303],"tip":null,"p":"Patient suffers from discoloration around previously restored lower incisors by esthetic restoration and other one complaint from recurrent caries around also, previously restored lower six by esthetic restoration: What is the problem?","a":"Marginal percolation","pg":"lb12","src":"Logbook p.12 Q1a"},{"s":"Dental Biomaterials","k":"sa","im":[303],"tip":null,"p":"Patient suffers from discoloration around previously restored lower incisors by esthetic restoration and other one complaint from recurrent caries around also, previously restored lower six by esthetic restoration: What is the cause of this phenomenon?","a":"Large difference in coefficient of thermal expansion between the tooth and the ; restorative material","pg":"lb12","src":"Logbook p.12 Q1b"},{"s":"Dental Biomaterials","k":"sa","im":[304],"tip":null,"p":"Slight mismatch in coefficient of thermal expansion between ceramic and metal is essential why???","a":"Because the metal will exert compression on porcelain  decrease crack propagation  increase toughness (residual compressive stresses)","pg":"lb12","src":"Logbook p.12 Q2"},{"s":"Dental Biomaterials","k":"sa","im":[],"tip":null,"p":"Mention cause of crazing appeared in the acrylic resin denture base under the artificial teeth? And how to avoid?","a":"Large difference in coefficient of thermal expansion between the denture base material and the artificial teeth close matching of coefficient of thermal expansion or choose artificial teeth from same material of denture base","pg":"lb13","src":"Logbook p.13 Q1"},{"s":"Dental Biomaterials","k":"sa","im":[305],"tip":null,"p":"What are the optical properties used to build the esthetic restoration?","a":"Reflection ; refraction ; scattering ; degree of translucency","pg":"lb14","src":"Logbook p.14 Q1"},{"s":"Dental Biomaterials","k":"sa","im":[306],"tip":null,"p":"Why line of demarcation was seen at interface of composite restoration OR organic matrix and inorganic filler? And how it can be avoided to distinguish between them?","a":"Due to difference in refractive index ; use a material with refractive index similar to that of the tooth","pg":"lb14","src":"Logbook p.14 Q2"},{"s":"Dental Biomaterials","k":"sa","im":[],"tip":null,"p":"Clinician starts to select the color. He looks to color deeply (long time). The color appears to become less and less saturated until appears almost gray. Why???","a":"Color fatigue","pg":"lb14","src":"Logbook p.14 Q3"},{"s":"Dental Biomaterials","k":"sa","im":[307],"tip":null,"p":"Discuss the causes that led to ease of differentiation between the esthetic restoration and tooth interface.","a":"Due to difference in refractive index between tooth & filling material","pg":"lb15","src":"Logbook p.15 Q1"},{"s":"Dental Biomaterials","k":"sa","im":[],"tip":null,"p":"A ceramic veneer to be bonded on an anterior tooth matches the color of the shade guide but not the adjacent tooth. What most likely caused this problem, and how could it have been avoided?","a":"Metamerism : color selected under fluorescent lamp or improper surrounding factors color selection must be in day light","pg":"lb15","src":"Logbook p.15 Q2"},{"s":"Dental Biomaterials","k":"sa","im":[308],"tip":null,"p":"Patient came back to your clinic complain from darker color esthetic restoration after chemical cured composite placement (as not that was selected with you). Discuss the different possible causes of complain.","a":"Air incorporation during mixing act as scattering agent for light makes the restoration looks darker & dull","pg":"lb15","src":"Logbook p.15 Q3"},{"s":"Dental Biomaterials","k":"sa","im":[304],"tip":null,"p":"Porcelain fused to metal is always different than the selected shade????","a":"Due to translucency of porcelain, shade affected by underlying metal","pg":"lb16","src":"Logbook p.16 Q2"},{"s":"Dental Biomaterials","k":"sa","im":[],"tip":null,"p":"Clinician starts to select the color. He closed the unit light and selected the color under fluorescent lamp of clinic. He sent color to lab but at delivery day he found mismatch in color. What is the expected problem of color occurred???","a":"Metamerism","pg":"lb16","src":"Logbook p.16 Q3"},{"s":"Dental Biomaterials","k":"sa","im":[],"tip":null,"p":"A person with ceramic crowns or composite restorations viewed under a black light in a nightclub appeared with missing teeth (ghost restoration); what is the expected problem??","a":"Absence of fluorescing agent","pg":"lb16","src":"Logbook p.16 Q4"},{"s":"Dental Biomaterials","k":"sa","im":[302],"tip":null,"p":"Why the rigid base is used under large amalgam","a":"Because the base will exert compression on amalgam  decrease crack propagation  increase toughness (residual compressive stresses)","pg":"lb18","src":"Logbook p.18 Q1"},{"s":"Dental Biomaterials","k":"sa","im":[309],"tip":null,"p":"What are the mechanical properties that control the removal from under cut from patient mouth?","a":"Flexibility","pg":"lb18","src":"Logbook p.18 Q2"},{"s":"Dental Biomaterials","k":"sa","im":[310],"tip":null,"p":"What is the mechanical property that control marginal adaptation of metallic crown??","a":"Ductility","pg":"lb18","src":"Logbook p.18 Q3"},{"s":"Dental Biomaterials","k":"sa","im":[311],"tip":null,"p":"Label the following stress –strain curve and Characterize material represented by that curve, mention mode of fracture (justify your answer).","a":"Weak, flexible, brittle, limited toughness crack propagation","pg":"lb19","src":"Logbook p.19 Q1"},{"s":"Dental Biomaterials","k":"sa","im":[312],"tip":null,"p":"What is the suggested test to test the tension of amalgam? Why??","a":"Brazilian test  as it brittle material, weak under tension","pg":"lb21","src":"Logbook p.21 Q1"},{"s":"Dental Biomaterials","k":"sa","im":[],"tip":null,"p":"On delivery; Clinician instructs patient of acrylic resin denture; During denture cleaning should put beaker was filled by water under denture. Why??","a":"To prevent fracture by accidental dropping as it has","pg":"lb21","src":"Logbook p.21 Q2a"},{"s":"Dental Biomaterials","k":"sa","im":[],"tip":null,"p":"On delivery; Clinician instructs patient of acrylic resin denture; Never to use strong bleaching. Why?","a":"Low impact strength ; to avoid crazing (solvent action to the polymers)","pg":"lb21","src":"Logbook p.21 Q2b"},{"s":"Dental Biomaterials","k":"sa","im":[310],"tip":null,"p":"Why Ni-Cr alloy crown is difficult in finishing and polishing??","a":"Because it has high hardness","pg":"lb22","src":"Logbook p.22 Q1"},{"s":"Dental Biomaterials","k":"sa","im":[313],"tip":null,"p":"Why does a mesio-occlusal-distal (MOD) amalgam fail in tension when compressive biting forces are applied from the opposing teeth? Testing:","a":"As it brittle material, weak under tension strong in compression ; Brazilian test (diametral compression for tension)","pg":"lb24","src":"Logbook p.24 Q2"},{"s":"Dental Biomaterials","k":"sa","im":[314],"tip":null,"p":"Discuss the mechanism of bonding composite restorative material to tooth structure?","a":"Acid Etching technique result in pores or microtags in the surface of a solid & restoration hardens in these tags forming a micro-mechanical interlocking","pg":"lb26","src":"Logbook p.26 Q2"},{"s":"Dental Biomaterials","k":"sa","im":[315],"tip":null,"p":"What is the type of bond that retains this removable partial denture?","a":"MacroMechanical","pg":"lb26","src":"Logbook p.26 Q3"},{"s":"Dental Biomaterials","k":"sa","im":[318,319],"tip":null,"p":"Why wax pattern should be coated by wetting agent before casting?","a":"To increase surface energy of wax and ensure complete wetting by the investment material to avoid rough casted restoration","pg":"lb27","src":"Logbook p.27 Q1"},{"s":"Dental Biomaterials","k":"sa","im":[317],"tip":null,"p":"Why the adhesive is applied over the primer prior to composite filling application?","a":"To decrease contraction stress and avoid fracture of composite as the restoration has high viscosity while the primer has low one","pg":"lb27","src":"Logbook p.27 Q2"},{"s":"Dental Biomaterials","k":"sa","im":[316],"tip":null,"p":"Patient suffers from discoloration around previously restored lower incisors by esthetic restoration and other one complaint from recurrent caries around also, previously restored lower six by esthetic restoration: What is the problem?","a":"Marginal percolation","pg":"lb27","src":"Logbook p.27 Q3a"},{"s":"Dental Biomaterials","k":"sa","im":[316],"tip":null,"p":"Patient suffers from discoloration around previously restored lower incisors by esthetic restoration and other one complaint from recurrent caries around also, previously restored lower six by esthetic restoration: What is the cause of this phenomenon?","a":"Polymerization shrinkage ; large difference in coefficient of thermal expansion between the tooth and the ; restorative material","pg":"lb27","src":"Logbook p.27 Q3b"},{"s":"Dental Biomaterials","k":"sa","im":[304],"tip":null,"p":"Slight mismatch in coefficient of thermal expansion between ceramic and metal is essential why???","a":"Because the metal will exert compression on porcelain  decrease crack propagation  increase toughness (residual compressive stresses)","pg":"lb28","src":"Logbook p.28 Q1"},{"s":"Dental Biomaterials","k":"sa","im":[320,321],"tip":null,"p":"Guessing the problem of uncured composite restoration : When Dentist use a Zinc Oxide and Eugenol base under composite restoration and cured the restoration by light.","a":"Eugenol react the free radicals and inhibit","pg":"lb29","src":"Logbook p.29 Q1a"},{"s":"Dental Biomaterials","k":"sa","im":[322],"tip":null,"p":"Which is the type of polymerization reaction illustrated in this picture?","a":"Condensation polymerization","pg":"lb31","src":"Logbook p.31 Q2"},{"s":"Dental Biomaterials","k":"sa","im":[323],"tip":null,"p":"Identify and discuss this phenomenon when casting two metals has great difference in melting temperature?","a":"Coring: It is the non-uniform composition of the crystal (grain) during solidification where the center (core) of the crystal is rich in the metal of higher melting point while the periphery of the crystal is rich in the metal of lower melting point.","pg":"lb35","src":"Logbook p.35 Q2"},{"s":"Dental Biomaterials","k":"sa","im":[324],"tip":null,"p":"Identify type of alloy that was used in the following soldering process? Why it was selected?","a":"Eutectic alloy used in soldering as it has specified melting point lower than parent metals","pg":"lb35","src":"Logbook p.35 Q3"},{"s":"Dental Biomaterials","k":"sa","im":[327],"tip":null,"p":"What happen when gold alloy restoration opposing amalgam filling? Why? How can be prevented or avoided??","a":"Galvanic Corrosion two dissimilar metals comes in contact leading to corrosion of one of them. ; Solutions : Use varnish – Use same type of opposing restoration - crown from material that has low electric activity","pg":"lb38","src":"Logbook p.38 Q1"},{"s":"Dental Biomaterials","k":"sa","im":[326],"tip":null,"p":"Why the amalgam restoration appeared darker in color and dull? How it can be avoided??","a":"Corrosion proper finishing & polishing avoid deep pits & fissures during carving","pg":"lb38","src":"Logbook p.38 Q2"},{"s":"Dental Biomaterials","k":"sa","im":[328],"tip":null,"p":"Why any metallic restoration should be smooth and lustrous??","a":"To avoid tarnish & corrosion","pg":"lb38","src":"Logbook p.38 Q3"},{"s":"Dental Biomaterials","k":"sa","im":[329],"tip":null,"p":"Why Admixed amalgam powder is highly susceptible to corrosion??","a":"As it contain Ag-Cu (silver – copper alloy) eutectic alloy","pg":"lb38","src":"Logbook p.38 Q4"},{"s":"Dental Biomaterials","k":"sa","im":[297],"tip":null,"p":"In base metal alloy partial denture: Give reason why the clasp of this partial denture is fractured after certain time from using?","a":"Stress Cell Corrosion: (highly stressed area)","pg":"lb39","src":"Logbook p.39 Q1a"},{"s":"Dental Biomaterials","k":"sa","im":[297],"tip":null,"p":"In base metal alloy partial denture: Heat treatment of cold worked structure increase corrosion resistance, why?","a":"As it Relief the internal stresses that cause corrosion","pg":"lb39","src":"Logbook p.39 Q1b"},{"s":"Dental Biomaterials","k":"sa","im":[297],"tip":null,"p":"In base metal alloy partial denture: Why base metal alloy can resist corrosion?","a":"Due to formation of passive layer (passivity)","pg":"lb39","src":"Logbook p.39 Q1c"},{"s":"Dental Biomaterials","k":"sa","im":[330],"tip":null,"p":"What are the parameters of cathode /anode ratio affecting corrosion resistance?","a":"High \\ low electrode potential high \\ low dissolution tendency","pg":"lb39","src":"Logbook p.39 Q2"},{"s":"Dental Biomaterials","k":"sa","im":[325],"tip":null,"p":"In opposing gold alloy bridge: Why it can resist corrosion?","a":"Nobility (Inert)","pg":"lb40","src":"Logbook p.40 Q1a"},{"s":"Dental Biomaterials","k":"sa","im":[325],"tip":null,"p":"In opposing gold alloy bridge: If economic gold alloy is used, what is the mechanism of corrosion resistance?","a":"Contains 42 : 58% gold & the rest of 75% is silver in addition to palladium to avoid","pg":"lb40","src":"Logbook p.40 Q1b"},{"s":"Dental Biomaterials","k":"sa","im":[331],"tip":null,"p":"Why the opposing cored structure is undesirable structure?. How it can be used safely??.","a":"Heterogeneous structure  tarnish & corrosion ; Homogenization: This is a process of elimination of compositional differences in a cored structure.","pg":"lb40","src":"Logbook p.40 Q2"}]}</script>
<script>
const D=JSON.parse(document.getElementById('d').textContent),$=s=>document.querySelector(s),A=$('#app');D.q.forEach((q,i)=>q.id=i);const PQ=D.q.filter(q=>q.k!='ref');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().replace(/[^a-z0-9\u0600-\u06ff ]/g,' ').replace(/\s+/g,' ').trim();
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const subs=[...new Set(D.q.map(q=>q.s))];
const META={'Oral Histology':['🔬','Image with a red arrow: name the structure or stage'],'Oral Biology':['🧬','Image with a red arrow: name the structure or stage'],'Pathology':['🧫','Slide or jar: diagnose, then compare the description'],'Dental Biomaterials':['🧪','Logbook questions with their images'],'Anatomy (Head & Neck)':['💀','One specific arrow on the skull: what does it point to?']};
let ST={h:{},r:[],th:'',st:{},m:'s'};try{ST=Object.assign(ST,JSON.parse(localStorage.getItem('ospe1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('ospe1',JSON.stringify(ST))}catch(e){}};
if(ST.th)document.documentElement.dataset.theme=ST.th;
function theme(){const d=document.documentElement,cur=d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');ST.th=cur=='dark'?'light':'dark';d.dataset.theme=ST.th;save()}
function lev(a,b){const m=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=m[0];m[0]=i;for(let j=1;j<=b.length;j++){const t=m[j];m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]==b[j-1]?0:1));p=t}}return m[b.length]}
function ok(t,a){t=norm(t);a=norm(a);if(!t)return false;if(t==a)return true;if(t.length>=4&&(a.includes(t)||t.includes(a)))return true;
 if(a.length>=5&&lev(t,a)<=Math.max(1,Math.floor(a.length*.18)))return true;const x=new Set(t.split(' ')),y=new Set(a.split(' '));let n=0;x.forEach(w=>{if(y.has(w))n++});return n/Math.max(x.size,y.size)>=.6}
const S={cfg:{}};
function stats(s){const qs=PQ.filter(q=>q.s==s),seen=qs.filter(q=>ST.h[q.id]),good=qs.filter(q=>ST.h[q.id]&&ST.h[q.id].ok);return{n:qs.length,seen:seen.length,good:good.length,bad:seen.length-good.length}}
function setup(){S.on=false;S.stu=false;A.innerHTML=`<div class="hd"><div><h1>🦷 OSPE Practical Exam</h1><div class="m">Choose a mode, then a subject</div></div><button class="g" onclick="theme()" aria-label="Theme">🌓</button></div><div class="seg" style="margin-bottom:8px"><button class="${ST.m!='p'?'on':''}" onclick="setM('s')">📖 Studying</button><button class="${ST.m=='p'?'on':''}" onclick="setM('p')">📝 Practice</button></div><div class="m" style="margin-bottom:12px">${ST.m=='p'?'Timed stations with scoring. Write or MCQ.':'Browse every question with its answer. No timer, no score.'}</div>`+subs.map((s,i)=>{const t=stats(s),m=META[s]||['📘',''];return `<div class="card sub" role="button" tabindex="0" onclick="go(${i})" onkeydown="if(event.key=='Enter')go(${i})"><div class="ic">${m[0]}</div><div class="i"><b>${esc(s)}</b><div class="m">${m[1]} · ${t.n} stations · ${D.q.filter(q=>q.s==s).length-t.n?`+${D.q.filter(q=>q.s==s).length-t.n} study refs`:''}</div><div class="pb"><i style="width:${t.good/t.n*100}%"></i></div><div class="m" style="margin-top:4px">Mastered ${t.good} · Needs review ${t.bad} · Not attempted ${t.n-t.seen}</div></div></div>`}).join('')+`<div class="m" style="text-align:center;margin-top:18px">By Omar Walid · Your progress is saved on this device <button class="g" onclick="if(confirm('Clear all progress?')){ST.h={};ST.r=[];save();setup()}">Clear</button></div>`}
function cfg(i){const s=subs[i],t=stats(s);S.sub=s;S.md=S.md||'t';
 A.innerHTML=`<div class="hd"><button class="g" onclick="setup()">← Back</button><h1>${(META[s]||[''])[0]} ${esc(s)}</h1></div>
<div class="card"><div class="lb" style="margin-top:0">Answer mode</div><div class="seg" id="sg"><button data-v="t" onclick="setMd('t')">✍️ Write</button><button data-v="c" onclick="setMd('c')">🔘 MCQ</button></div><div class="m" id="mdn" style="margin-top:6px"></div>
<div class="lb">Questions</div><select id="pool"><option value="all">All questions (${t.n})</option><option value="new">Not attempted yet (${t.n-t.seen})</option><option value="bad">My weak points (${t.bad})</option><option value="star">Starred (${D.q.filter(q=>q.s==s&&ST.st[q.id]).length})</option></select>
<div class="lb">Number of stations</div><select id="n">${[5,10,20,40].filter(x=>x<t.n).map(x=>`<option>${x}</option>`).join('')}<option value="999">All</option></select>
<div class="lb">Time per station</div><select id="tm"><option value="0">No timer</option><option value="30">30 s</option><option value="45">45 s</option><option value="60" selected>60 s</option><option value="90">90 s</option><option value="120">120 s</option></select></div>
<button class="p" style="width:100%" onclick="start()">Start exam</button>`;setMd(S.md)}
function setMd(v){S.md=v;document.querySelectorAll('#sg button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));$('#mdn').textContent=v=='t'?'You type your answer, then it is checked (auto-check is approximate; you can override).':'4 options per station, auto-graded. ("Write on paper" stations stay reveal-and-compare).'}

function setM(m){ST.m=m;save();setup()}
function go(i){ST.m=='p'?cfg(i):study(i)}
const SA=()=>ST.sa!==false;
function study(i){S.sub=subs[i];S.sf='all';S.sl=D.q.filter(q=>q.s==S.sub);S.si=0;S.sv=-1;S.stu=true;S.on=false;sr()}
function sf(v){S.sf=v;let l=D.q.filter(q=>q.s==S.sub);if(v=='star')l=l.filter(q=>ST.st[q.id]);if(v=='ref')l=l.filter(q=>q.k=='ref');if(v=='qa')l=l.filter(q=>q.k!='ref');if(v=='bad')l=l.filter(q=>ST.h[q.id]&&!ST.h[q.id].ok);S.sl=l;S.si=0;S.sv=-1;sr()}
function shf(){S.sl=shuf(S.sl);S.si=0;S.sv=-1;sr()}
function sn(d){S.si=Math.min(Math.max(S.si+d,0),S.sl.length-1);S.sv=-1;sr();scrollTo(0,0)}
function tgA(){ST.sa=!SA();S.sv=-1;save();sr()}
function rv2(){S.sv=S.si;sr()}
function star(){const q=S.sl[S.si];if(ST.st[q.id])delete ST.st[q.id];else ST.st[q.id]=1;save();sr()}
function sr(){const l=S.sl,q=l[S.si],m=(META[S.sub]||[''])[0];
 const sel=(v,t)=>`<option value="${v}" ${S.sf==v?'selected':''}>${t}</option>`;
 let h=`<div class="hd"><button class="g" onclick="S.stu=false;setup()">← Back</button><h1>${m} ${esc(S.sub)}</h1></div><div class="row" style="margin-bottom:10px"><select onchange="sf(this.value)">${sel('all','All questions')}${sel('qa','Questions only')}${sel('ref','Labeled references')}${sel('star','Starred only')}${sel('bad','My weak points')}</select><button onclick="shf()">🔀 Shuffle</button><button onclick="tgA()">${SA()?'🙈 Hide answers':'👁 Show answers'}</button></div>`;
 if(!q){A.innerHTML=h+'<div class="card m">Nothing here yet.</div>';return}
 const nq=l[S.si+1];if(nq)nq.im.forEach(k=>{const p=new Image();p.src=IMG(k)});
 const show=SA()||S.sv==S.si;
 h+=`<div class="tr m" style="margin-bottom:6px"><span>${S.si+1} / ${l.length}</span><span>${esc(q.src)}</span></div><div class="pb" style="margin:0 0 10px"><i style="width:${(S.si+1)/l.length*100}%"></i></div><div class="card">${imgs(q.im,q.tip)}<div class="q" dir="auto">${esc(q.p)}</div>`;
 if(q.k=='ref'){}else if(show)h+=`<div class="ans"><b dir="auto">${q.k=='id'?esc(q.a):'Model answer:'}</b>${q.k!='id'?`<pre dir="auto">${esc(q.a)}</pre>`:''}${q.d?`<pre dir="auto" class="m">${esc(q.d)}</pre>`:''}</div>${q.ai&&q.ai.length?'<div class="lb">Labeled image for review</div>'+imgs(q.ai):''}`;
 else h+=`<button class="p" style="width:100%" onclick="rv2()">Show answer <span class="kb m">Space</span></button>`;
 h+=`</div><div class="row"><button onclick="sn(-1)" ${S.si==0?'disabled':''}>← Prev</button><button onclick="star()">${ST.st[q.id]?'★ Starred':'☆ Star'}</button><button class="p" onclick="sn(1)" ${S.si==l.length-1?'disabled':''}>Next →</button></div>`;
 A.innerHTML=h}
function start(list){if(!list){const p=$('#pool').value;S.cfg={md:S.md,tm:+$('#tm').value};let pl=PQ.filter(q=>q.s==S.sub);if(p=='new')pl=pl.filter(q=>!ST.h[q.id]);if(p=='bad')pl=pl.filter(q=>ST.h[q.id]&&!ST.h[q.id].ok);if(p=='star')pl=pl.filter(q=>ST.st[q.id]);
 if(!pl.length)return alert('No questions available for this selection yet');list=shuf(pl).slice(0,+$('#n').value)}
 S.l=list;S.i=0;S.r=[];S.t0=Date.now();S.on=true;show()}
function imgs(ix,tip,eager){return ix.map((k,j)=>`<div class="imw"><img src="${IMG(k)}" decoding="async" alt="" onclick="zoom(this)">${tip&&j==0?`<div class="mk" style="left:${tip[0]*100}%;top:${tip[1]*100}%"></div>`:''}</div>`).join('')}
function zoom(e){const z=$('#z');z.querySelector('img').src=e.src;z.style.display='block';z.scrollTop=0}
const wd=s=>new Set(norm(s).split(' ').filter(w=>w.length>2));
const jac=(a,b)=>{let n=0;a.forEach(x=>{if(b.has(x))n++});return n/Math.max(1,a.size+b.size-n)};
function opts(q){const qa=wd(q.a),qq=wd(q.p),L=q.a.length,pool=PQ.filter(x=>x.k==q.k&&x.s==q.s&&norm(x.a)!=norm(q.a)&&norm(x.a).length>1);
 const sc=x=>2*jac(wd(x.p),qq)+jac(wd(x.a),qa)+(x.pg==q.pg?1.2:0)+Math.min(L,x.a.length)/Math.max(L,x.a.length)+Math.random()*.25;
 const rk=pool.map(x=>[sc(x),x]).sort((a,b)=>b[0]-a[0]),o=[],seen=new Set([norm(q.a)]);
 for(const [,x] of rk){if(o.length>=3)break;const n=norm(x.a);if(seen.has(n)||n.includes(norm(q.a))||norm(q.a).includes(n)||jac(wd(x.a),qa)>.6)continue;seen.add(n);o.push(x.a)}if(o.length<3){for(const x of shuf(PQ.filter(x=>x.s==q.s&&x.k!='long'&&norm(x.a)!=norm(q.a)))){if(o.length>=3)break;const n=norm(x.a);if(!seen.has(n)&&x.a.length<120){seen.add(n);o.push(x.a)}}}
 return shuf(o.concat([q.a]))}
const cut=t=>t.length>150?t.slice(0,150)+'…':t;
function show(){clearTimeout(S.h);cancelAnimationFrame(S.f);const q=S.l[S.i];S.rv=false;S.mc=S.cfg.md=='c'&&q.k!='long';const nq=S.l[S.i+1];if(nq)nq.im.forEach(k=>{const p=new Image();p.src=IMG(k)});
 A.innerHTML=`<div class="top"><div class="tr"><button class="g" onclick="if(confirm('End the exam?'))end()">✕ End</button><span class="m">Station ${S.i+1} / ${S.l.length}</span><span class="tm" id="tt">${S.cfg.tm?S.cfg.tm:''}</span></div><div class="pb"><i id="pg" style="width:${S.i/S.l.length*100}%"></i></div></div>
 <div class="card">${imgs(q.im,q.tip)}<div class="q" dir="auto">${esc(q.p)}</div><div id="in"></div><div id="rs"></div></div>`;const g=$('#in');
 if(S.mc){S.o=opts(q);if(S.o.length<3)S.mc=false}
 if(S.mc){g.innerHTML=S.o.map((o,i)=>`<button class="opt" dir="auto" onclick="pick(${i})"><span class="l">${'ABCD'[i]}</span><span>${esc(cut(o))}</span></button>`).join('')}
 else if(q.k=='long')g.innerHTML=`<button class="p" style="width:100%" onclick="rev()">Done, reveal the answer</button>`;
 else if(q.k=='sa')g.innerHTML=`<textarea id="tx" dir="auto" rows="4" placeholder="Type your answer"></textarea><button class="p" style="width:100%;margin-top:8px" onclick="rev()">Submit</button>`;
 else{g.innerHTML=`<input type="text" id="tx" dir="auto" placeholder="Type your answer" autocomplete="off" autocapitalize="off"><button class="p" style="width:100%;margin-top:8px" onclick="rev()">Submit <span class="kb m">Enter</span></button>`;if(!matchMedia('(pointer:coarse)').matches)$('#tx').focus()}
 if(S.cfg.tm){S.end=Date.now()+S.cfg.tm*1000;const L=()=>{const r=Math.max(0,Math.ceil((S.end-Date.now())/1000)),e=$('#tt');if(e){e.textContent=r;e.classList.toggle('lo',r<=10)}if(r<=0){if(!S.rv)S.mc?pick(-1):rev()}else if(!S.rv)S.f=requestAnimationFrame(()=>{S.h=setTimeout(L,250)})};L()}}
function rec(q,c){ST.h[q.id]={ok:!!c,t:Date.now()};S.r[S.i]=!!c;save()}
function pick(i){const q=S.l[S.i];if(S.rv)return;S.rv=true;const c=i>=0&&norm(S.o[i])==norm(q.a);
 document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(norm(S.o[j])==norm(q.a))b.classList.add('g2');else if(j==i)b.classList.add('r2')});rec(q,c);done(q,c,false,i<0)}
function rev(){const q=S.l[S.i];if(S.rv)return;S.rv=true;const t=$('#tx'),v=t?t.value:'';let c=null;if(q.k=='id'){c=ok(v,q.a);rec(q,c)}
 $('#in').innerHTML=q.k=='long'?'':`<div class="you" dir="auto"><span class="m">Your answer:</span><pre>${esc(v||'—')}</pre></div>`;done(q,c,c!==null,false)}
function done(q,c,ov,to){const r=$('#rs');let h=c===null?'':`<div class="fb ${c?'y':'n'}">${c?'✅ Correct':(to?'⏱ Time is up':'❌ Wrong')}</div>`;
 h+=`<div class="ans"><b dir="auto">${q.k=='id'?esc(q.a):'Model answer:'}</b>${q.k!='id'?`<pre dir="auto">${esc(q.a)}</pre>`:''}${q.d?`<pre dir="auto" class="m">${esc(q.d)}</pre>`:''}<div class="m">${esc(q.src)}</div></div>${q.ai&&q.ai.length?'<div class="lb">Labeled image for review</div>'+imgs(q.ai):''}`;
 if(S.mc)h+=`<button class="p" style="width:100%;margin-top:12px" onclick="nx()">${S.i+1<S.l.length?'Next →':'Results'} <span class="kb m">Enter</span></button>`;
 else h+=`<div class="m" style="margin:12px 0 6px">${ov?'Auto-check is approximate, adjust if needed:':'Mark yourself:'}</div><div class="row"><button class="ok" onclick="mark(true)">✓ I was right <span class="kb m">1</span></button><button class="no" onclick="mark(false)">✗ I was wrong <span class="kb m">2</span></button></div>`;
 r.innerHTML=h;r.scrollIntoView({behavior:'smooth',block:'nearest'})}
function mark(v){rec(S.l[S.i],v);nx()}
function nx(){if(S.r[S.i]===undefined)S.r[S.i]=false;S.i++;S.i<S.l.length?show():end()}
function end(){S.on=false;clearTimeout(S.h);const n=S.l.length,done=S.r.length;if(!done){setup();return}const tot=S.r.filter(Boolean).length,pc=Math.round(tot/n*100),sec=Math.round((Date.now()-S.t0)/1000),bad=S.l.filter((q,i)=>!S.r[i]);
 ST.r.unshift({s:S.sub,sc:tot,n,d:Date.now()});ST.r=ST.r.slice(0,50);save();const C=2*Math.PI*42;
 A.innerHTML=`<div class="hd"><h1>Results</h1></div><div class="card" style="text-align:center"><svg width="130" height="130" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--c2)" stroke-width="9"/><circle cx="50" cy="50" r="42" fill="none" stroke="var(--${pc>=60?'ok':'no'})" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*pc/100} ${C}" transform="rotate(-90 50 50)"/><text x="50" y="56" text-anchor="middle" font-size="22" font-weight="800" fill="var(--t)">${pc}%</text></svg>
 <div class="stat"><div><b style="color:var(--ok)">${tot}</b><span class="m">Correct</span></div><div><b style="color:var(--no)">${n-tot}</b><span class="m">Wrong</span></div><div><b>${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}</b><span class="m">Time</span></div></div></div>
 ${bad.length?`<div class="card"><b>For review (${bad.length})</b>${bad.map(q=>`<div class="rv">${q.im.length?`<img src="${IMG(q.im[0])}" alt="" onclick="zoom(this)">`:''}<div dir="auto" style="min-width:0"><b>${esc(q.k=='id'?q.a:cut(q.a))}</b><div class="m">${esc(q.src)}</div></div></div>`).join('')}</div><button class="p" style="width:100%;margin-bottom:8px" onclick="start(shuf(S.l.filter((q,i)=>!S.r[i])))">Retry wrong questions (${bad.length})</button>`:'<div class="card" style="text-align:center">🔥 All correct, excellent!</div>'}
 <button style="width:100%" onclick="setup()">Back to subjects</button>`;scrollTo(0,0)}
document.addEventListener('keydown',e=>{if(S.stu){if(e.target.tagName=='SELECT')return;if(e.key=='ArrowRight')sn(1);else if(e.key=='ArrowLeft')sn(-1);else if(e.key==' '){e.preventDefault();SA()?0:rv2()}return}if(!S.on)return;const tg=e.target.tagName,q=S.l[S.i];if(S.rv){if(S.mc&&(e.key=='Enter'||e.key==' ')){e.preventDefault();nx()}else if(!S.mc){if(e.key=='1')mark(true);if(e.key=='2')mark(false)}return}
 if(S.mc&&'1234'.includes(e.key)&&S.o[+e.key-1]!==undefined)pick(+e.key-1);else if(!S.mc&&e.key=='Enter'&&tg!='TEXTAREA'&&tg!='BUTTON')rev();else if(e.key=='Enter'&&e.ctrlKey)rev()});
setup();
</script></body></html>
